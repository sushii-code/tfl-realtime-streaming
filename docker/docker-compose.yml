# Give this stack a fixed name, so the volume is not just named after the "docker" folder
name: tfl-realtime-streaming

# The list of containers to run
services:
  # The Kafka broker; other containers reach it by this service name, "kafka"
  kafka:
    # Use the official Kafka image, pinned to one exact version
    image: apache/kafka:4.3.2
    # The fixed name we use for this container in docker commands
    container_name: tfl-kafka
    # The ports to open from my laptop into the container
    ports:
      # laptop:container - only this laptop can connect, because Kafka has no password here
      - "127.0.0.1:9092:9092"
    # The settings Kafka reads when it starts
    environment:
      # This broker's ID number
      KAFKA_NODE_ID: 1
      # An ID for the whole cluster; it must stay the same so saved data can be reused
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # KRaft mode: this one process is both broker and controller, so no ZooKeeper is needed
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Where the controller can be found: node 1, at kafka, on port 9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Which listener the controller uses
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # The three ports Kafka listens on inside the container
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      # The addresses Kafka tells clients to use: kafka:29092 for containers, localhost:9092 for my laptop
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      # All three listeners use plain, unencrypted connections, which is fine on one laptop
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      # Which listener brokers use to talk to each other
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Store message data in the folder that the volume below keeps safe
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Keep messages for 7 days (7 x 24 = 168 hours), then delete them
      KAFKA_LOG_RETENTION_HOURS: 168
      # We have one broker, so Kafka's offsets topic can only have 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # We have one broker, so Kafka's transactions topic can only have 1 copy
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Only 1 copy of the transactions topic has to be available
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # We have one broker, so Kafka's share-group topic can only have 1 copy
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      # Only 1 copy of the share-group topic has to be available
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Let consumers start straight away, which suits a local setup
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # The folders to store outside the container
    volumes:
      # Keep Kafka's data folder in the named volume, so it survives restarts
      - kafka_data:/var/lib/kafka/data
    # How Docker checks that Kafka is really working, not just started
    healthcheck:
      # Ask the broker for its API versions; this only succeeds if the broker answers
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      # Run the check every 10 seconds
      interval: 10s
      # Count the check as failed if it takes longer than 10 seconds
      timeout: 10s
      # Mark Kafka unhealthy after 10 failed checks in a row
      retries: 10
      # Give Kafka 30 seconds to start before failed checks begin to count
      start_period: 30s

  # The web page for looking inside Kafka
  kafka-ui:
    # Use the Kafbat Kafka UI image, pinned to one exact version
    image: kafbat/kafka-ui:v1.5.0
    # The fixed name we use for this container in docker commands
    container_name: tfl-kafka-ui
    # The ports to open from my laptop into the container
    ports:
      # Open the UI at http://localhost:8080, from this laptop only
      - "127.0.0.1:8080:8080"
    # The containers that must be ready before this one starts
    depends_on:
      # Wait for the kafka service
      kafka:
        # Start the UI only once Kafka's healthcheck passes
        condition: service_healthy
    # The settings the UI reads when it starts
    environment:
      # The name shown for this cluster in the UI
      KAFKA_CLUSTERS_0_NAME: "local"
      # The UI is a container, so it uses Kafka's address for containers
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

  # Airflow, which runs the pipeline on a schedule
  airflow:
    # How to build this container's image
    build:
      # Send the project's main folder to the build; .dockerignore hides all but requirements.txt
      context: ..
      # Where the build instructions are
      dockerfile: airflow/Dockerfile
    # The name to give the image we build
    image: tfl-airflow:3.3.2
    # The fixed name we use for this container in docker commands
    container_name: tfl-airflow
    # Run the scheduler, web page and everything else in this one container
    command: ["airflow", "standalone"]
    # The ports to open from my laptop into the container
    ports:
      # Open the UI at http://127.0.0.1:8081, from this laptop only
      - "127.0.0.1:8081:8080"
    # The containers that must be ready before this one starts
    depends_on:
      # Wait for the kafka service
      kafka:
        # Start Airflow only once Kafka's healthcheck passes
        condition: service_healthy
    # The file of Snowflake and dbt settings
    env_file:
      # The file's location, next to this one
      - path: .env
        # Let Kafka still start if the file is missing; Airflow's tasks will then report the problem
        required: false
    # The settings that are the same on every laptop
    environment:
      # Do not fill the UI with Airflow's example DAGs
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Airflow is a container, so it uses Kafka's address for containers
      KAFKA_BOOTSTRAP_SERVER: "kafka:29092"
      # Where the loader finds the private key, relative to /opt/tfl
      SNOWFLAKE_PRIVATE_KEY_PATH: "keys/rsa_key.p8"
      # Where dbt finds the private key inside the container
      TFL_DBT_PRIVATE_KEY_PATH: "/opt/tfl/keys/rsa_key.p8"
      # The dbt folder is read-only, so dbt writes its build files here instead
      DBT_TARGET_PATH: "/tmp/dbt/target"
      # The dbt folder is read-only, so dbt writes its logs here instead
      DBT_LOG_PATH: "/tmp/dbt/logs"
      # Turn off dbt's usage tracking, which also tries to write a file to the dbt folder
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    # The folders to share with the container
    volumes:
      # Keep Airflow's database, logs and login in a named volume, so they survive restarts
      - airflow_home:/opt/airflow
      # The DAG files, read-only
      - ../airflow/dags:/opt/airflow/dags:ro
      # The consumer's code, read-only
      - ../consumer:/opt/tfl/consumer:ro
      # The loader's code, read-only
      - ../snowflake:/opt/tfl/snowflake:ro
      # The dbt project, read-only
      - ../dbt:/opt/tfl/dbt:ro
      # The private key, read-only, so nothing in the container can change it
      - ../keys:/opt/tfl/keys:ro
      # The landing files, read-write, because the consumer writes here
      - ../data/landing:/opt/tfl/data/landing

# The named volumes used above
volumes:
  # Docker creates and looks after this volume, which holds Kafka's data
  kafka_data:
  # Docker creates and looks after this volume, which holds Airflow's data
  airflow_home:
